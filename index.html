<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Flask</title>
</head>
<body>
    <h1>Formulario de contacto</h1>

    <form action="/procesar" method="POST">
        <label for="nombre">Nombre completo:</label><br>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="programa">Programa académico:</label><br>
        <input type="text" id="programa" name="programa"><br><br>

        <label for="correo">Correo electrónico:</label><br>
        <input type="text" id="correo" name="correo"><br><br>

        <label for="edad">Edad:</label><br>
        <input type="text" id="edad" name="edad"><br><br>

        <label for="mensaje">Mensaje:</label><br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="30"></textarea><br><br>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
